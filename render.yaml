databases:
  - name: mysitedb
    plan: free
    databaseName: mysite
    user: mysite

services:
  - type: web
    plan: free
    name: mysite
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn sistema_cafe.asgi:application -k uvicorn.workers.UvicornWorker'

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mysitedb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
        
        # ---- NUEVAS VARIABLES DE ENTORNO PARA GROQ ----
      - key: GROQ_API_KEY
        sync: false # Esto le indica a Render que el valor es secreto y debes ingresarlo manualmente en su panel
      - key: GROQ_MODEL
        value: 'openai/gpt-oss-120b' # Tu modelo por defecto de settings.py
